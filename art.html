
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080617">
  <title>🖍️ (　´ᯅ`　) 🎨</title>

  <style>
    :root {
      --pink: #ff69e8;
      --blue: #69eaff;
      --purple: #b78aff;
      --white: #f7edff;
      --bg: #080617;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      font-family:
        "MS Gothic",
        "ＭＳ ゴシック",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background:
        linear-gradient(rgba(7, 4, 23, 0.62), rgba(7, 4, 23, 0.78)),
        url("files/neon_back.jpg") center center / cover fixed,
        var(--bg);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      width: 42vw;
      height: 42vw;
      min-width: 260px;
      min-height: 260px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.16;
      animation: glow-drift 14s ease-in-out infinite alternate;
    }

    .ambient::before {
      top: -12%;
      left: -10%;
      background: var(--pink);
    }

    .ambient::after {
      right: -12%;
      bottom: -15%;
      background: var(--blue);
      animation-delay: -6s;
    }

    @keyframes glow-drift {
      from {
        transform: translate(0, 0) scale(0.9);
      }
      to {
        transform: translate(10vw, 7vh) scale(1.15);
      }
    }

    #spores {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .spore {
      position: absolute;
      bottom: -15px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--spore-color);
      box-shadow: 0 0 9px var(--spore-color);
      opacity: 0;
      animation: spore-rise var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes spore-rise {
      0% {
        transform: translate3d(0, 0, 0) scale(0.6);
        opacity: 0;
      }
      12% {
        opacity: var(--opacity);
      }
      80% {
        opacity: var(--opacity);
      }
      100% {
        transform: translate3d(var(--drift), -110vh, 0) scale(1.2);
        opacity: 0;
      }
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      padding: 42px 18px 35px;
    }

    header {
      position: relative;
      z-index: 3;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--blue);
      font-size: 11px;
      letter-spacing: 0.32em;
      text-shadow: 0 0 12px var(--blue);
    }

    h1 {
      margin: 0;
      color: #fff5ff;
      font-size: clamp(27px, 5vw, 43px);
      letter-spacing: 0.08em;
      text-shadow:
        0 0 7px #fff,
        0 0 17px var(--pink),
        0 0 35px #b42cff;
    }

    .subtitle {
      margin: 17px 0 0;
      color: #e1d2f5;
      font-size: 13px;
      line-height: 2;
      letter-spacing: 0.06em;
    }

    .hint {
      margin: 14px 0 0;
      color: #a99ac8;
      font-size: 11px;
      letter-spacing: 0.14em;
    }

    .gallery {
      position: relative;
      width: 100%;
      max-width: 1100px;
      height: clamp(480px, 67vh, 730px);
      min-height: 480px;
      margin: 12px auto 0;
      isolation: isolate;
    }

    .gallery::before {
      content: "";
      position: absolute;
      inset: 7% 5%;
      border: 1px solid rgba(184, 138, 255, 0.12);
      border-radius: 48% 52% 43% 57% / 48% 43% 57% 52%;
      box-shadow:
        inset 0 0 65px rgba(142, 68, 255, 0.06),
        0 0 55px rgba(142, 68, 255, 0.06);
      pointer-events: none;
    }

    .gallery::after {
      content: "✧  ·  ✦  ·  ✧";
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: -1;
      transform: translate(-50%, -50%);
      color: rgba(204, 169, 255, 0.15);
      font-size: clamp(32px, 6vw, 60px);
      letter-spacing: 0.6em;
      white-space: nowrap;
      pointer-events: none;
    }

    .art-orb {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--diameter);
      height: var(--diameter);
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      cursor: pointer;
      background:
        radial-gradient(circle at 30% 25%, #5d376f, #16102d 70%);
      box-shadow:
        0 0 8px rgba(255, 105, 232, 0.65),
        0 0 22px rgba(183, 138, 255, 0.4),
        inset 0 0 14px rgba(255, 255, 255, 0.18);
      transform: translate(-50%, -50%);
      animation: float-orb var(--float-time) ease-in-out infinite alternate;
      animation-delay: var(--float-delay);
      transition:
        box-shadow 0.3s ease,
        border-color 0.3s ease,
        filter 0.3s ease;
      z-index: 2;
    }

    .art-orb img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .art-orb:hover,
    .art-orb:focus-visible {
      z-index: 5;
      outline: none;
      border-color: #fff;
      box-shadow:
        0 0 12px #fff,
        0 0 25px var(--pink),
        0 0 48px var(--purple);
      filter: brightness(1.15);
    }

    .art-orb:hover img,
    .art-orb:focus-visible img {
      transform: scale(1.13);
    }

    .art-orb::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 50%;
      pointer-events: none;
    }

    @keyframes float-orb {
      from {
        translate: 0 -8px;
      }
      to {
        translate: 7px 12px;
      }
    }

    .image-fallback {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 8px;
      color: #f6d9ff;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
      background:
        radial-gradient(circle, rgba(255, 105, 232, 0.25), transparent 65%),
        #17102c;
    }

    .art-viewer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 65px 20px 30px;
      background: rgba(5, 3, 18, 0.9);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    .art-viewer.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .viewer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      max-height: 100%;
      transform: scale(0.94) translateY(12px);
      transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .art-viewer.is-open .viewer-content {
      transform: scale(1) translateY(0);
    }

    .art-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-height: calc(100vh - 155px);
      min-height: 100px;
    }

    #largeArt {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 155px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 5px;
      box-shadow:
        0 0 10px rgba(255, 255, 255, 0.12),
        0 0 35px rgba(255, 105, 232, 0.22),
        0 0 80px rgba(105, 234, 255, 0.12);
      animation: image-appear 0.45s ease both;
    }

    @keyframes image-appear {
      from {
        opacity: 0;
        transform: scale(0.97);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .viewer-fallback {
      display: none;
      padding: 35px 24px;
      color: #ffd4fb;
      text-align: center;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .art-caption {
      margin: 18px 0 0;
      color: #f5eaff;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-align: center;
      text-shadow: 0 0 12px var(--pink);
    }

    .art-number {
      margin: 8px 0 0;
      color: #a99bc8;
      font-size: 10px;
      letter-spacing: 0.2em;
    }

    .close-button {
      position: fixed;
      top: 20px;
      right: 22px;
      z-index: 22;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 50%;
      color: white;
      background: rgba(24, 13, 43, 0.85);
      box-shadow: 0 0 15px rgba(255, 105, 232, 0.25);
      font-size: 25px;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .close-button:hover,
    .close-button:focus-visible {
      outline: none;
      border-color: white;
      box-shadow: 0 0 22px var(--pink);
      transform: rotate(90deg);
    }

    footer {
      position: relative;
      z-index: 3;
      padding: 8px 0 18px;
      text-align: center;
    }

    .back-link {
      display: inline-block;
      padding: 10px 20px;
      border: 1px solid rgba(105, 234, 255, 0.55);
      border-radius: 30px;
      color: var(--blue);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.1em;
      box-shadow: 0 0 13px rgba(105, 234, 255, 0.12);
      transition: 0.25s ease;
    }

    .back-link:hover,
    .back-link:focus-visible {
      outline: none;
      color: #fff;
      background: rgba(105, 234, 255, 0.1);
      box-shadow:
        0 0 10px var(--blue),
        0 0 25px rgba(105, 234, 255, 0.2);
    }

    .footer-note {
      margin-top: 17px;
      color: #9382ae;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    @media (max-width: 600px) {
      .page {
        padding: 32px 10px 25px;
      }

      .subtitle {
        font-size: 12px;
      }

      .gallery {
        height: 610px;
        min-height: 530px;
        margin-top: 8px;
      }

      .gallery::before {
        inset: 5% 0;
      }

      .art-viewer {
        padding: 60px 12px 24px;
      }

      .art-frame,
      #largeArt {
        max-height: calc(100dvh - 150px);
      }

      .close-button {
        top: 13px;
        right: 13px;
      }

      .art-caption {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient" aria-hidden="true"></div>
  <div id="spores" aria-hidden="true"></div>

  <main class="page">
    <header>
      <p class="eyebrow">KOKO WASHI NO HUNGI TENGOKU</p>
      <h1>🖍️ (　´ᯅ`　) 🎨</h1>

      <p class="subtitle">
        管理人の絵を展示しています(　´ᯅ`　)<br>
        気になった胞子に触れてみてください🍄
      </p>

      <p class="hint">✧ TAP A LITTLE SPORE ✧</p>
    </header>

    <section
      class="gallery"
      id="gallery"
      aria-label="作品一覧"
    >
    </section>

    <footer>
      <a class="back-link" href="index.html">↩ 🍄‍🟫 帰る</a>
      <p class="footer-note">
        made of tiny spores &amp; STRANGE MATTARI THINGS ✧
      </p>
    </footer>
  </main>

  <div
    class="art-viewer"
    id="artViewer"
    role="dialog"
    aria-modal="true"
    aria-label="でかく表示"
    aria-hidden="true"
  >
    <button
      class="close-button"
      id="closeViewer"
      type="button"
      aria-label="閉じる"
    >×</button>

    <div class="viewer-content">
      <div class="art-frame">
        <img id="largeArt" src="" alt="">
        <div class="viewer-fallback" id="viewerFallback">
          (　´ᯅ`；)物を紛失してしまいました……！<br>
          画像名と居場所を確認してください 🍄
        </div>
      </div>

      <p class="art-caption" id="artCaption"></p>
      <p class="art-number" id="artNumber"></p>
    </div>
  </div>

  <script>
    /*
    ==================================================
      🍄 展示する作品の一覧 🍄

      thumbnail = 丸いサムネイル画像
      image     = クリック後に大きく表示する本画像
      title     = 作品名

      画像を差し替えるときは、この一覧を編集するよ。
    ==================================================
    */

    const artworks = [
      {
        thumbnail: "files/dks.png",
        image: "files/dekame.jpg",
        title: "dekame"
      },
      {
        thumbnail: "files/fas.png",
        image: "files/famoi.jpg",
        title: "famoi"
      },
      {
        thumbnail: "files/h2s.png",
        image: "files/ht2.jpg",
        title: "ht2"
      },
      {
        thumbnail: "files/hts.png",
        image: "files/ht.jpg",
        title: "ht"
      },
      {
        thumbnail: "files/ins.png",
        image: "files/inaiko.jpg",
        title: "inaiko"
      },
      {
        thumbnail: "files/jns.png",
        image: "files/jane.jpg",
        title: "jane"
      },
      {
        thumbnail: "files/khs.png",
        image: "files/kuragehead.jpg",
        title: "kuragehead"
      },
      {
        thumbnail: "files/krs.png",
        image: "files/kurages.jpg",
        title: "kurages"
      },
      {
        thumbnail: "files/mds.png",
        image: "files/medama.jpg",
        title: "medama"
      },
      {
        thumbnail: "files/n2s.png",
        image: "files/neki2.jpg",
        title: "neki2"
      },
      {
        thumbnail: "files/nks.png",
        image: "files/neki.jpg",
        title: "neki"
      },
      {
        thumbnail: "files/ods.png",
        image: "files/oddeye.jpg",
        title: "oddeye"
      },
      {
        thumbnail: "files/prs.png",
        image: "files/primary0.jpg",
        title: "primary0"
      },
      {
        thumbnail: "files/tas.png",
        image: "files/tama.jpg",
        title: "tama"
      },
      {
        thumbnail: "files/tms.png",
        image: "files/tempa.jpg",
        title: "tempa"
      },
      {
        thumbnail: "files/ums.png",
        image: "files/uma2ra.jpg",
        title: "uma2ra"
      },
      {
        thumbnail: "files/yms.png",
        image: "files/yamiko.jpg",
        title: "yamiko"
      },
      {
        thumbnail: "files/yrs.png",
        image: "files/yuriko.jpg",
        title: "yuriko"
      }
    ];

    // 胞子の色
    const sporeColors = [
      "#ff69e8",
      "#69eaff",
      "#c59aff",
      "#fff0ff"
    ];

    const sporesContainer = document.getElementById("spores");

    for (let i = 0; i < 42; i++) {
      const spore = document.createElement("span");
      spore.className = "spore";

      spore.style.left = Math.random() * 100 + "%";

      spore.style.setProperty(
        "--size",
        (2 + Math.random() * 4) + "px"
      );

      spore.style.setProperty(
        "--duration",
        (12 + Math.random() * 22) + "s"
      );

      spore.style.setProperty(
        "--delay",
        (-Math.random() * 30) + "s"
      );

      spore.style.setProperty(
        "--drift",
        (Math.random() * 150 - 75) + "px"
      );

      spore.style.setProperty(
        "--opacity",
        (0.25 + Math.random() * 0.55).toFixed(2)
      );

      spore.style.setProperty(
        "--spore-color",
        sporeColors[
          Math.floor(Math.random() * sporeColors.length)
        ]
      );

      sporesContainer.appendChild(spore);
    }

    const gallery = document.getElementById("gallery");
    const viewer = document.getElementById("artViewer");
    const closeButton = document.getElementById("closeViewer");
    const largeArt = document.getElementById("largeArt");
    const viewerFallback = document.getElementById("viewerFallback");
    const artCaption = document.getElementById("artCaption");
    const artNumber = document.getElementById("artNumber");

    let lastFocusedElement = null;

    function makePositions(count) {
      const positions = [];
      const isMobile = window.matchMedia("(max-width: 600px)").matches;

      const minX = isMobile ? 10 : 8;
      const maxX = isMobile ? 90 : 92;
      const minY = 9;
      const maxY = 91;
      const minDistance = isMobile ? 17 : 15;

      let attempts = 0;

      while (positions.length < count && attempts < count * 150) {
        attempts++;

        const x = minX + Math.random() * (maxX - minX);
        const y = minY + Math.random() * (maxY - minY);

        const hasSpace = positions.every(position => {
          const dx = (x - position.x) * (isMobile ? 0.8 : 1);
          const dy = y - position.y;

          return Math.sqrt(dx * dx + dy * dy) > minDistance;
        });

        if (hasSpace) {
          positions.push({ x, y });
        }
      }

      while (positions.length < count) {
        positions.push({
          x: minX + Math.random() * (maxX - minX),
          y: minY + Math.random() * (maxY - minY)
        });
      }

      return positions;
    }

    function renderGallery() {
      gallery.innerHTML = "";

      const positions = makePositions(artworks.length);

      artworks.forEach((art, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "art-orb";

        button.setAttribute(
          "aria-label",
          art.title + " を大きく表示"
        );

        const position = positions[index];
        const diameter = 68 + Math.random() * 40;

        button.style.setProperty("--x", position.x + "%");
        button.style.setProperty("--y", position.y + "%");
        button.style.setProperty("--diameter", diameter + "px");

        button.style.setProperty(
          "--float-time",
          (3 + Math.random() * 4) + "s"
        );

        button.style.setProperty(
          "--float-delay",
          (-Math.random() * 5) + "s"
        );

        const img = document.createElement("img");
        img.src = art.thumbnail;
        img.alt = "";
        img.loading = "lazy";

        const fallback = document.createElement("span");
        fallback.className = "image-fallback";
        fallback.textContent = "🍄\n画像を確認してね";

        img.addEventListener("error", () => {
          img.style.display = "none";
          fallback.style.display = "flex";
        });

        button.appendChild(img);
        button.appendChild(fallback);

        button.addEventListener("click", () => {
          openArtwork(index, button);
        });

        gallery.appendChild(button);
      });
    }

    function openArtwork(index, sourceButton) {
      const art = artworks[index];

      lastFocusedElement = sourceButton;

      largeArt.style.display = "block";
      viewerFallback.style.display = "none";

      largeArt.removeAttribute("src");
      largeArt.src = art.image;
      largeArt.alt = art.title;

      artCaption.textContent = art.title;

      artNumber.textContent =
        "SPORE " +
        String(index + 1).padStart(2, "0") +
        " / " +
        String(artworks.length).padStart(2, "0");

      viewer.classList.add("is-open");
      viewer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      closeButton.focus();
    }

    function closeArtwork() {
      viewer.classList.remove("is-open");
      viewer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";

      if (lastFocusedElement) {
        lastFocusedElement.focus({ preventScroll: true });
      }
    }

    largeArt.addEventListener("error", () => {
      largeArt.style.display = "none";
      viewerFallback.style.display = "block";
    });

    largeArt.addEventListener("load", () => {
      largeArt.style.display = "block";
      viewerFallback.style.display = "none";
    });

    closeButton.addEventListener("click", closeArtwork);

    viewer.addEventListener("click", event => {
      if (event.target === viewer) {
        closeArtwork();
      }
    });

    document.addEventListener("keydown", event => {
      if (
        event.key === "Escape" &&
        viewer.classList.contains("is-open")
      ) {
        closeArtwork();
      }
    });

    renderGallery();
  </script>
</body>
</html>
