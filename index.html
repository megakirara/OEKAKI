<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070720">
  <title>🖍️ ( ´ᯅ` ) 🎨</title>

  <style>
    :root {
      --pink: #ff69e8;
      --blue: #69eaff;
      --purple: #b78aff;
      --white: #f7edff;
      --bg: #070720;
      --neon-pink: #ff7ad9;
      --neon-cyan: #4de1ff;
      --neon-yellow: #ffe84a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    #background-image {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(7, 7, 32, 0.40), rgba(7, 7, 32, 0.55)),
        url("files/neon_back.jpg");
      background-repeat: no-repeat, repeat;
      background-attachment: fixed, fixed;
      background-position: center, center;
      background-size: auto, 1111px auto;
    }

    #background-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
      transition: transform 0.1s ease-out;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      font-family:
        "MS Gothic",
        "ＭＳ ゴシック",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: transparent;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      width: 42vw;
      height: 42vw;
      min-width: 260px;
      min-height: 260px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.16;
      animation: glow-drift 14s ease-in-out infinite alternate;
    }

    .ambient::before {
      top: -12%;
      left: -10%;
      background: var(--pink);
    }

    .ambient::after {
      right: -12%;
      bottom: -15%;
      background: var(--blue);
      animation-delay: -6s;
    }

    @keyframes glow-drift {
      from {
        transform: translate(0, 0) scale(0.9);
      }
      to {
        transform: translate(10vw, 7vh) scale(1.15);
      }
    }

    #spores {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .spore {
      position: absolute;
      bottom: -15px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--spore-color);
      box-shadow: 0 0 9px var(--spore-color);
      opacity: 0;
      animation: spore-rise var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes spore-rise {
      0% {
        transform: translate3d(0, 0, 0) scale(0.6);
        opacity: 0;
      }
      12% {
        opacity: var(--opacity);
      }
      80% {
        opacity: var(--opacity);
      }
      100% {
        transform: translate3d(var(--drift), -110vh, 0) scale(1.2);
        opacity: 0;
      }
    }

    .star {
      position: absolute;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      padding: 42px 18px 35px;
    }

    header {
      position: relative;
      z-index: 3;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 13px;
      color: var(--blue);
      font-size: 11px;
      letter-spacing: 0.32em;
      text-shadow: 0 0 12px var(--blue);
    }

    .title-link {
      display: inline-block;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .title-link:hover {
      transform: scale(1.05);
    }

    h1 {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .title-img {
      max-width: 100%;
      height: auto;
      max-height: 130px;
      object-fit: contain;
      animation: ultraSoftRainbowNeon 80s infinite ease-in-out;
    }

    @keyframes ultraSoftRainbowNeon {
      0%, 100% {
        filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #ff7ad9) drop-shadow(0 0 32px #ff3dc8);
        opacity: 0.95;
      }
      20% {
        filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #4de1ff) drop-shadow(0 0 32px #00eaff);
        opacity: 0.9;
      }
      40% {
        filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #b6ff5c) drop-shadow(0 0 32px #82ff28);
        opacity: 0.95;
      }
      60% {
        filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #ffe84a) drop-shadow(0 0 32px #ffcc00);
        opacity: 0.9;
      }
      80% {
        filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #b68cff) drop-shadow(0 0 32px #924dff);
        opacity: 0.95;
      }
    }

    .subtitle {
      margin: 17px 0 0;
      color: #e1d2f5;
      font-size: 13px;
      line-height: 2;
      letter-spacing: 0.06em;
    }

    .hint {
      margin: 14px 0 0;
      color: #a99ac8;
      font-size: 11px;
      letter-spacing: 0.14em;
    }

    .gallery {
      position: relative;
      width: 100%;
      max-width: 1100px;
      height: clamp(480px, 67vh, 730px);
      min-height: 480px;
      margin: 12px auto 0;
      isolation: isolate;
    }

    .gallery::before {
      content: "";
      position: absolute;
      inset: 7% 5%;
      border: 1px solid rgba(184, 138, 255, 0.12);
      border-radius: 48% 52% 43% 57% / 48% 43% 57% 52%;
      box-shadow:
        inset 0 0 65px rgba(142, 68, 255, 0.06),
        0 0 55px rgba(142, 68, 255, 0.06);
      pointer-events: none;
    }

    .gallery::after {
      content: "✧  ·  ✦  ·  ✧";
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: -1;
      transform: translate(-50%, -50%);
      color: rgba(204, 169, 255, 0.15);
      font-size: clamp(32px, 6vw, 60px);
      letter-spacing: 0.6em;
      white-space: nowrap;
      pointer-events: none;
    }

    .art-orb {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--diameter);
      height: var(--diameter);
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      cursor: pointer;
      background:
        radial-gradient(circle at 30% 25%, #5d376f, #16102d 70%);
      box-shadow:
        0 0 8px rgba(255, 105, 232, 0.65),
        0 0 22px rgba(183, 138, 255, 0.4),
        inset 0 0 14px rgba(255, 255, 255, 0.18);
      transform: translate(-50%, -50%);
      animation: float-orb var(--float-time) ease-in-out infinite alternate;
      animation-delay: var(--float-delay);
      transition:
        box-shadow 0.3s ease,
        border-color 0.3s ease,
        filter 0.3s ease;
      z-index: 2;
    }

    .art-orb img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .art-orb:hover,
    .art-orb:focus-visible {
      z-index: 5;
      outline: none;
      border-color: #fff;
      box-shadow:
        0 0 12px #fff,
        0 0 25px var(--pink),
        0 0 48px var(--purple);
      filter: brightness(1.15);
    }

    .art-orb:hover img,
    .art-orb:focus-visible img {
      transform: scale(1.13);
    }

    .art-orb::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 50%;
      pointer-events: none;
    }

    @keyframes float-orb {
      from {
        translate: 0 -8px;
      }
      to {
        translate: 7px 12px;
      }
    }

    .image-fallback {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 8px;
      color: #f6d9ff;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
      background:
        radial-gradient(circle, rgba(255, 105, 232, 0.25), transparent 65%),
        #17102c;
    }

    .art-viewer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: rgba(5, 3, 18, 0.9);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      cursor: pointer;
      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    .art-viewer.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .viewer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      max-height: 100%;
      transform: scale(0.94) translateY(12px);
      transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .art-viewer.is-open .viewer-content {
      transform: scale(1) translateY(0);
    }

    .art-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-height: calc(100vh - 155px);
      min-height: 100px;
    }

    #largeArt {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 155px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 5px;
      box-shadow:
        0 0 10px rgba(255, 255, 255, 0.12),
        0 0 35px rgba(255, 105, 232, 0.22),
        0 0 80px rgba(105, 234, 255, 0.12);
      animation: image-appear 0.45s ease both;
    }

    @keyframes image-appear {
      from {
        opacity: 0;
        transform: scale(0.97);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .viewer-fallback {
      display: none;
      padding: 35px 24px;
      color: #ffd4fb;
      text-align: center;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .art-caption {
      margin: 18px 0 0;
      color: #f5eaff;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-align: center;
      text-shadow: 0 0 12px var(--pink);
    }

    .art-number {
      margin: 8px 0 0;
      color: #a99bc8;
      font-size: 10px;
      letter-spacing: 0.2em;
    }

    footer {
      position: relative;
      z-index: 3;
      padding: 20px 0 25px;
      text-align: center;
    }

    .footer-note {
      margin-top: 10px;
      color: #9382ae;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    @media (max-width: 600px) {
      .page {
        padding: 32px 10px 25px;
      }

      .subtitle {
        font-size: 12px;
      }

      .title-img {
        max-height: 90px;
      }

      .gallery {
        height: 610px;
        min-height: 530px;
        margin-top: 8px;
      }

      .gallery::before {
        inset: 5% 0;
      }

      .art-viewer {
        padding: 40px 12px 24px;
      }

      .art-frame,
      #largeArt {
        max-height: calc(100dvh - 150px);
      }

      .art-caption {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="background-image"></div>
  <div id="background-wrap">
    <div class="ambient" aria-hidden="true"></div>
    <div id="spores" aria-hidden="true"></div>
  </div>

  <main class="page">
    <header>
      <p class="eyebrow">KOKO WASHI NO HUNGI TENGOKU</p>
      <a href="https://megakirara.github.io/-KINOKO/" class="title-link">
        <h1><img src="files/art.png" alt="🖍️ ( ´ᯅ` ) 🎨" class="title-img"></h1>
      </a>

      <p class="subtitle">
        わたしの絵置き場です( ´ᯅ` )🎨<br>
        気になるTHINGSに触れてみてください🍄
      </p>

      <p class="hint">✧ TAP A LITTLE SPORE ✧</p>
    </header>

    <section
      class="gallery"
      id="gallery"
      aria-label="作品一覧"
    >
    </section>

    <footer>
      <p class="footer-note">
        made of tiny spores &amp; STRANGE MATTARI THINGS ✧
      </p>
    </footer>
  </main>

  <div
    class="art-viewer"
    id="artViewer"
    role="dialog"
    aria-modal="true"
    aria-label="でかく表示（クリックで閉じる）"
    aria-hidden="true"
  >
    <div class="viewer-content">
      <div class="art-frame">
        <img id="largeArt" src="" alt="">
        <div class="viewer-fallback" id="viewerFallback">
        🍄( ´ᯅ`；)絵が見つかりません……！<br>
        </div>
      </div>

      <p class="art-caption" id="artCaption"></p>
      <p class="art-number" id="artNumber"></p>
    </div>
  </div>

  <script>
    const artworks = [
      {
        thumbnail: "smn/dks.png",
        image: "art/dekame.jpg",
        title: "でか目ちゃん"
      },
      {
        thumbnail: "smn/fas.png",
        image: "art/famoi.jpg",
        title: "ふぇもいちゃん"
      },
      {
        thumbnail: "smn/h2s.png",
        image: "art/ht2.jpg",
        title: "フラワー鳥まんじゅう2号"
      },
      {
        thumbnail: "smn/hts.png",
        image: "art/ht.jpg",
        title: "フラワー鳥まんじゅう"
      },
      {
        thumbnail: "smn/ins.png",
        image: "art/inaiko.jpg",
        title: "いない子"
      },
      {
        thumbnail: "smn/jns.png",
        image: "art/jane.jpg",
        title: "じぇいんちゃん"
      },
      {
        thumbnail: "smn/khs.png",
        image: "art/kuragehead.jpg",
        title: "くらげあたまちゃん"
      },
      {
        thumbnail: "smn/krs.png",
        image: "art/kurages.jpg",
        title: "くらげ親子"
      },
      {
        thumbnail: "smn/mds.png",
        image: "art/medama.jpg",
        title: "めんたま"
      },
      {
        thumbnail: "smn/n2s.png",
        image: "art/neki2.jpg",
        title: "おねいさん2号"
      },
      {
        thumbnail: "smn/nks.png",
        image: "art/neki.jpg",
        title: "おねいさん"
      },
      {
        thumbnail: "smn/ods.png",
        image: "art/oddeye.jpg",
        title: "オッドアイちゃん"
      },
      {
        thumbnail: "smn/prs.png",
        image: "art/primary0.jpg",
        title: "プライマリーゼロちゃん"
      },
      {
        thumbnail: "smn/tas.png",
        image: "art/tama.jpg",
        title: "たまちゃん"
      },
      {
        thumbnail: "smn/tms.png",
        image: "art/tempa.jpg",
        title: "天パちゃん"
      },
      {
        thumbnail: "smn/ums.png",
        image: "art/uma2ra.jpg",
        title: "ウマヅラさん"
      },
      {
        thumbnail: "smn/yms.png",
        image: "art/yamiko.jpg",
        title: "病み子"
      },
      {
        thumbnail: "smn/yrs.png",
        image: "art/yuriko.jpg",
        title: "ゆりこちゃん"
      }
    ];

    const sporeColors = [
      "#ff69e8",
      "#69eaff",
      "#c59aff",
      "#fff0ff"
    ];

    const sporesContainer = document.getElementById("spores");

    for (let i = 0; i < 42; i++) {
      const spore = document.createElement("span");
      spore.className = "spore";

      spore.style.left = Math.random() * 100 + "%";

      spore.style.setProperty(
        "--size",
        (2 + Math.random() * 4) + "px"
      );

      spore.style.setProperty(
        "--duration",
        (12 + Math.random() * 22) + "s"
      );

      spore.style.setProperty(
        "--delay",
        (-Math.random() * 30) + "s"
      );

      spore.style.setProperty(
        "--drift",
        (Math.random() * 150 - 75) + "px"
      );

      spore.style.setProperty(
        "--opacity",
        (0.25 + Math.random() * 0.55).toFixed(2)
      );

      spore.style.setProperty(
        "--spore-color",
        sporeColors[
          Math.floor(Math.random() * sporeColors.length)
        ]
      );

      sporesContainer.appendChild(spore);
    }

    const bgWrap = document.getElementById("background-wrap");
    const NEON_COLORS = ['#ff7ad9', '#4de1ff', '#ffe84a', '#b68cff'];

    for (let i = 0; i < 100; i++) {
      const star = document.createElement("div");
      star.classList.add("star");

      const color = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];

      star.style.background = color;
      star.style.boxShadow = `0 0 6px ${color}`;
      star.style.width = star.style.height = (Math.random() * 2 + 1) + "px";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";

      bgWrap.appendChild(star);
    }

    document.addEventListener("mousemove", (e) => {
      const moveX = (e.clientX / window.innerWidth - 0.5) * 30;
      const moveY = (e.clientY / window.innerHeight - 0.5) * 30;
      bgWrap.style.transform = `translate(${-moveX}px,${-moveY}px)`;
    });

    const gallery = document.getElementById("gallery");
    const viewer = document.getElementById("artViewer");
    const largeArt = document.getElementById("largeArt");
    const viewerFallback = document.getElementById("viewerFallback");
    const artCaption = document.getElementById("artCaption");
    const artNumber = document.getElementById("artNumber");

    let lastFocusedElement = null;

    function makePositions(count) {
      const positions = [];
      const isMobile = window.matchMedia("(max-width: 600px)").matches;

      const minX = isMobile ? 10 : 8;
      const maxX = isMobile ? 90 : 92;
      const minY = 9;
      const maxY = 91;
      const minDistance = isMobile ? 17 : 15;

      let attempts = 0;

      while (positions.length < count && attempts < count * 150) {
        attempts++;

        const x = minX + Math.random() * (maxX - minX);
        const y = minY + Math.random() * (maxY - minY);

        const hasSpace = positions.every(position => {
          const dx = (x - position.x) * (isMobile ? 0.8 : 1);
          const dy = y - position.y;

          return Math.sqrt(dx * dx + dy * dy) > minDistance;
        });

        if (hasSpace) {
          positions.push({ x, y });
        }
      }

      while (positions.length < count) {
        positions.push({
          x: minX + Math.random() * (maxX - minX),
          y: minY + Math.random() * (maxY - minY)
        });
      }

      return positions;
    }

    function renderGallery() {
      gallery.innerHTML = "";

      const positions = makePositions(artworks.length);

      artworks.forEach((art, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "art-orb";

        button.setAttribute(
          "aria-label",
          art.title + " を大きく表示"
        );

        const position = positions[index];
        const diameter = 68 + Math.random() * 40;

        button.style.setProperty("--x", position.x + "%");
        button.style.setProperty("--y", position.y + "%");
        button.style.setProperty("--diameter", diameter + "px");

        button.style.setProperty(
          "--float-time",
          (3 + Math.random() * 4) + "s"
        );

        button.style.setProperty(
          "--float-delay",
          (-Math.random() * 5) + "s"
        );

        const img = document.createElement("img");
        img.src = art.thumbnail;
        img.alt = "";
        img.loading = "lazy";

        const fallback = document.createElement("span");
        fallback.className = "image-fallback";
        fallback.textContent = "🍄\n画像を確認してね";

        img.addEventListener("error", () => {
          img.style.display = "none";
          fallback.style.display = "flex";
        });

        button.appendChild(img);
        button.appendChild(fallback);

        button.addEventListener("click", () => {
          openArtwork(index, button);
        });

        gallery.appendChild(button);
      });

      setupSparkle();
    }

    function openArtwork(index, sourceButton) {
      const art = artworks[index];

      lastFocusedElement = sourceButton;

      largeArt.style.display = "block";
      viewerFallback.style.display = "none";

      largeArt.removeAttribute("src");
      largeArt.src = art.image;
      largeArt.alt = art.title;

      artCaption.textContent = art.title;

      artNumber.textContent =
        "SPORE " +
        String(index + 1).padStart(2, "0") +
        " / " +
        String(artworks.length).padStart(2, "0");

      viewer.classList.add("is-open");
      viewer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeArtwork() {
      viewer.classList.remove("is-open");
      viewer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";

      if (lastFocusedElement) {
        lastFocusedElement.focus({ preventScroll: true });
      }
    }

    largeArt.addEventListener("error", () => {
      largeArt.style.display = "none";
      viewerFallback.style.display = "block";
    });

    largeArt.addEventListener("load", () => {
      largeArt.style.display = "block";
      viewerFallback.style.display = "none";
    });

    viewer.addEventListener("click", () => {
      closeArtwork();
    });

    document.addEventListener("keydown", event => {
      if (
        event.key === "Escape" &&
        viewer.classList.contains("is-open")
      ) {
        closeArtwork();
      }
    });

    function setupSparkle() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const targets = document.querySelectorAll("h1, .title-link, .art-orb");
      const marks = ["✦", "✧", "✨"];

      function sparkle(element) {
        const rect = element.getBoundingClientRect();
        const spark = document.createElement("span");

        spark.textContent = marks[Math.floor(Math.random() * marks.length)];

        const sparkLeft = rect.left + window.scrollX + Math.random() * rect.width;
        const sparkTop = rect.top + window.scrollY + Math.random() * rect.height;

        Object.assign(spark.style, {
          position: "absolute",
          left: sparkLeft + "px",
          top: sparkTop + "px",
          zIndex: "9999",
          pointerEvents: "none",
          color: NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)],
          fontSize: (9 + Math.random() * 10) + "px",
          textShadow: "0 0 8px currentColor",
          opacity: "1",
          transition: "transform 750ms ease-out, opacity 750ms ease-out"
        });

        document.body.appendChild(spark);

        requestAnimationFrame(() => {
          const dx = (Math.random() - 0.5) * 44;
          const dy = -(18 + Math.random() * 32);
          const rot = (Math.random() - 0.5) * 180;
          spark.style.transform =
            `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.4)`;
          spark.style.opacity = "0";
        });

        window.setTimeout(() => spark.remove(), 800);
      }

      targets.forEach((element) => {
        let timer = null;

        element.addEventListener("mouseenter", () => {
          if (timer) return;
          sparkle(element);
          timer = window.setInterval(() => sparkle(element), 90);
        });

        element.addEventListener("mouseleave", () => {
          if (timer) {
            window.clearInterval(timer);
            timer = null;
          }
        });
      });
    }

    renderGallery();
  </script>
</body>
</html>
